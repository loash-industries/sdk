name: Publish

# description: Validate, release and publish to npm via semantic-release
permissions:
  id-token: write
  contents: read
  actions: read
  checks: write

on:
  push:
    branches:
      - main

jobs:
  validate-code:
    if: github.actor != 'github-actions[bot]'
    uses: loash-industries/public-workflows/.github/workflows/js-validate-code.yml@7f3d345e01a92525698a5d6148497fa0e8e133e9 # v0.3.0
    with:
      node_version: "22"
      npm_client: npm
      typecheck_command: run tscheck

  release:
    uses: loash-industries/public-workflows/.github/workflows/js-semantic-release.yml@7f3d345e01a92525698a5d6148497fa0e8e133e9 # v0.3.0
    permissions:  # tag + GitHub Release + npm, with the job's own token (DEVOPS-22)
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    needs: [ validate-code ]
    with:
      node_version: "22"
      environment: prd
      npm_client: npm
      # No NPM_TOKEN: npm publishes via trusted publishing (OIDC). The trusted
      # publisher on npmjs.com names this file (publish.yml) and environment
      # prd, and `id-token: write` above is what lets the release job request it.
      npm_trusted_publishing: true
      # Each release is staged on npm and goes live only once a maintainer
      # runs `npm stage approve <id>` (2FA). The trusted publisher grants
      # "npm stage publish" only, and .releaserc sets npmPublish: false.
      npm_staged_publishing: true

  # ── MCP server ─────────────────────────────────────────────────────────────
  # Published as a separate npm package and container image, but never as part
  # of the SDK tarball. Its version MIRRORS the SDK's exactly, so
  # @trinaryex/mcp@X.Y.Z always names the @trinaryex/sdk@X.Y.Z it wraps.
  #
  # Like the SDK, it is staged on npm through trusted publishing and goes live
  # only after a maintainer approves it with 2FA. A release therefore takes two
  # approvals, in order: the SDK first (this job waits for it, since the MCP
  # pins that exact version), then the MCP.

  # Checked against the SDK at this commit — the one `release` is about to
  # publish — rather than the npm version it replaces (see mcp-validate.yml).
  validate-mcp:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/mcp-validate.yml
    with:
      node_version: "22"

  publish-mcp:
    needs: [release, validate-mcp]
    runs-on: ubuntu-latest
    environment: prd
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # tags, to find the release tag on this commit
          persist-credentials: false

      # No registry-url: it writes an .npmrc that authenticates with
      # NODE_AUTH_TOKEN, and this job publishes with OIDC instead of a token.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Releases are tag-only since DEVOPS-22: package.json on main keeps its old
      # version, and the released version is the vX.Y.Z tag that `release` put on
      # this commit. No tag on this commit means no SDK release, so nothing to mirror.
      - name: Resolve the SDK version to mirror
        id: version
        run: |
          TAG=$(git tag --points-at "$GITHUB_SHA" --list 'v*' | sort -V | tail -n 1)
          if [ -z "$TAG" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "No release tag on $GITHUB_SHA, so no SDK release to mirror."
            exit 0
          fi
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@trinaryex/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "@trinaryex/mcp@$VERSION is already published — nothing to do."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Publishing @trinaryex/mcp@$VERSION to mirror the SDK."
          fi

      # `release` has only staged the SDK. It reaches the registry once a
      # maintainer approves it (see that job's summary for the command), and the
      # pin below needs it there.
      - name: Wait for the SDK release to be approved
        if: steps.version.outputs.already_published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "::notice::Waiting up to 30 minutes for @trinaryex/sdk@$VERSION. Approve its staged release (npm stage approve, see the release job summary)."
          for i in $(seq 1 60); do
            if npm view "@trinaryex/sdk@$VERSION" version >/dev/null 2>&1; then
              echo "@trinaryex/sdk@$VERSION is available."
              exit 0
            fi
            echo "Waiting for @trinaryex/sdk@$VERSION ($i/60)…"
            sleep 30
          done
          echo "::error::@trinaryex/sdk@$VERSION is still not on the registry after 30 minutes. Approve its staged release, then re-run this job."
          exit 1

      - name: Pin the MCP version and its SDK dependency
        if: steps.version.outputs.already_published == 'false'
        working-directory: mcp
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            pkg.dependencies['@trinaryex/sdk'] = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm install --no-audit --no-fund --package-lock-only

      - name: Build
        if: steps.version.outputs.already_published == 'false'
        working-directory: mcp
        run: |
          npm install --no-audit --no-fund
          npm run build

      # Trusted publishing (OIDC), staged for 2FA approval like the SDK. The
      # trusted publisher for @trinaryex/mcp on npmjs.com names this file
      # (publish.yml) and environment prd, and grants "npm stage publish" only.
      # Trusted publishing adds the provenance attestation itself.
      - name: Stage the release on npm
        if: steps.version.outputs.already_published == 'false'
        working-directory: mcp
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # npm needs the dist-tag spelled out for a prerelease (beta in 1.0.0-beta.2).
          tag=latest
          case "$VERSION" in
            *-*) tag=${VERSION#*-}; tag=${tag%%.*} ;;
          esac
          # Node 22's npm predates `npm stage`.
          npm install -g npm@^11.21.1
          npm stage publish --access public --tag "$tag" > "$RUNNER_TEMP/stage.out"
          cat "$RUNNER_TEMP/stage.out"

          # npm prints "+ <name>@<version> (staged with id <id>)". If that
          # changes, the summary falls back to `npm stage list`.
          id=$(sed -n 's/.*(staged with id \([^)]*\)).*/\1/p' "$RUNNER_TEMP/stage.out" | tail -n 1)
          if [ -n "$id" ]; then
            approve="npm stage approve $id"
          else
            approve="npm stage list @trinaryex/mcp   # then: npm stage approve <id>"
          fi
          echo "::notice::Staged @trinaryex/mcp@$VERSION on npm. Approve it with 2FA to make it installable: $approve"
          fence='```'
          {
            echo "### @trinaryex/mcp@$VERSION is staged on npm"
            echo
            echo "It isn't installable until a maintainer approves it with 2FA, with npm 11.21 or later or on [npmjs.com](https://www.npmjs.com/package/@trinaryex/mcp):"
            echo
            echo "${fence}sh"
            echo "$approve"
            echo "$fence"
          } >> "$GITHUB_STEP_SUMMARY"

      # arm64 as well as amd64: this runs on mixed-architecture clusters and on
      # Apple silicon workstations. A single amd64 image means emulation there.
      - name: Set up QEMU
        if: steps.version.outputs.already_published == 'false'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        if: steps.version.outputs.already_published == 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: steps.version.outputs.already_published == 'false'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the container image
        if: steps.version.outputs.already_published == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: mcp
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/triex-mcp:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/triex-mcp:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # The npm package publishes with provenance; the image should not be
          # the weaker link in the same release.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
