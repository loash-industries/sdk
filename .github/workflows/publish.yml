name: Publish

# description: Validate, release and publish to npm via semantic-release
permissions:
  id-token: write
  contents: read
  actions: read
  checks: write

on:
  push:
    branches:
      - main

jobs:
  validate-code:
    if: github.actor != 'github-actions[bot]'
    uses: loash-industries/public-workflows/.github/workflows/js-validate-code.yml@7f3d345e01a92525698a5d6148497fa0e8e133e9 # v0.3.0
    with:
      node_version: "22"
      npm_client: npm
      typecheck_command: run tscheck

  release:
    uses: loash-industries/public-workflows/.github/workflows/js-semantic-release.yml@7f3d345e01a92525698a5d6148497fa0e8e133e9 # v0.3.0
    permissions:  # tag + GitHub Release + npm, with the job's own token (DEVOPS-22)
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    needs: [ validate-code ]
    with:
      node_version: "22"
      environment: prd
      npm_client: npm
    secrets:
      NPM_TOKEN: ${{ secrets.TRINARYEX_NPM_TOKEN }}

  # ── MCP server ─────────────────────────────────────────────────────────────
  # Published as a separate npm package and container image, but never as part
  # of the SDK tarball. Its version MIRRORS the SDK's exactly, so
  # @trinaryex/mcp@X.Y.Z always names the @trinaryex/sdk@X.Y.Z it wraps.

  # Checked against the SDK at this commit — the one `release` is about to
  # publish — rather than the npm version it replaces (see mcp-validate.yml).
  validate-mcp:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/mcp-validate.yml
    with:
      node_version: "22"

  publish-mcp:
    needs: [release, validate-mcp]
    runs-on: ubuntu-latest
    environment: prd
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # tags, to find the release tag on this commit
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # Releases are tag-only since DEVOPS-22: package.json on main keeps its old
      # version, and the released version is the vX.Y.Z tag that `release` put on
      # this commit. No tag on this commit means no SDK release, so nothing to mirror.
      - name: Resolve the SDK version to mirror
        id: version
        run: |
          TAG=$(git tag --points-at "$GITHUB_SHA" --list 'v*' | sort -V | tail -n 1)
          if [ -z "$TAG" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "No release tag on $GITHUB_SHA, so no SDK release to mirror."
            exit 0
          fi
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@trinaryex/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "@trinaryex/mcp@$VERSION is already published — nothing to do."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Publishing @trinaryex/mcp@$VERSION to mirror the SDK."
          fi

      # `release` has only just published the SDK; the registry can take a
      # little while to serve the new version, and the pin below needs it.
      - name: Wait for the SDK version to reach the registry
        if: steps.version.outputs.already_published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for i in $(seq 1 30); do
            if npm view "@trinaryex/sdk@$VERSION" version >/dev/null 2>&1; then
              echo "@trinaryex/sdk@$VERSION is available."
              exit 0
            fi
            echo "Waiting for @trinaryex/sdk@$VERSION ($i/30)…"
            sleep 10
          done
          echo "@trinaryex/sdk@$VERSION never appeared on the registry." >&2
          exit 1

      - name: Pin the MCP version and its SDK dependency
        if: steps.version.outputs.already_published == 'false'
        working-directory: mcp
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            pkg.dependencies['@trinaryex/sdk'] = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm install --no-audit --no-fund --package-lock-only

      - name: Build
        if: steps.version.outputs.already_published == 'false'
        working-directory: mcp
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish to npm
        if: steps.version.outputs.already_published == 'false'
        working-directory: mcp
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TRINARYEX_NPM_TOKEN }}

      # arm64 as well as amd64: this runs on mixed-architecture clusters and on
      # Apple silicon workstations. A single amd64 image means emulation there.
      - name: Set up QEMU
        if: steps.version.outputs.already_published == 'false'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        if: steps.version.outputs.already_published == 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: steps.version.outputs.already_published == 'false'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the container image
        if: steps.version.outputs.already_published == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: mcp
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/triex-mcp:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/triex-mcp:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # The npm package publishes with provenance; the image should not be
          # the weaker link in the same release.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
