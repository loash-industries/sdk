name: Gateway drift

# `npm test` checks the SDK against a VENDORED copy of the gateway contract, so
# it is hermetic and catches drift we introduce. It cannot catch drift the
# gateway introduces — a renamed query parameter upstream leaves every test
# green while the SDK quietly stops filtering, because a gateway ignores keys
# it does not recognise rather than rejecting them.
#
# This job fetches the live contract instead. It needs no API key:
# /swagger.json is served unauthenticated.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/gateway-surface.mjs'
      - 'scripts/check-gateway.mjs'
      - 'scripts/check-schemas.mjs'
      - 'test/schema-conformance.test.ts'
      - 'test/fixtures/gateway-openapi.json'
      - '.github/workflows/gateway_drift.yml'
  schedule:
    # Daily, so an upstream change surfaces here rather than in production.
    - cron: '17 7 * * *'
  workflow_dispatch:

jobs:
  live-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Requests: endpoints and query parameters the SDK sends. --strict also
      # fails when the vendored copy is structurally stale, so the hermetic
      # suite never quietly tests against an old contract.
      - name: Check the SDK's requests against the live gateway contract
        run: npm run check:gateway -- --live --strict

      # Responses: what the SDK must parse. A field going nullable upstream
      # makes every read that meets one throw, and the request check cannot
      # see it.
      - name: Check the SDK's response schemas against the live gateway contract
        if: success() || failure()
        run: npm run check:schemas -- --live
