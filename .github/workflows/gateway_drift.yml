name: Gateway drift

# `npm test` checks the SDK against a VENDORED copy of the gateway contract, so
# it is hermetic and catches drift we introduce. It cannot catch drift the
# gateway introduces — a renamed query parameter upstream leaves every test
# green while the SDK quietly stops filtering, because a gateway ignores keys
# it does not recognise rather than rejecting them.
#
# This job fetches the live contract instead. It needs no API key:
# /swagger.json is served unauthenticated.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/gateway-surface.mjs'
      - 'scripts/check-gateway.mjs'
      - 'test/fixtures/gateway-openapi.json'
      - '.github/workflows/gateway_drift.yml'
  schedule:
    # Daily, so an upstream change surfaces here rather than in production.
    - cron: '17 7 * * *'
  workflow_dispatch:

jobs:
  live-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Check the SDK against the live gateway contract
        run: npm run check:gateway -- --live
