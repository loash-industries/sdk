name: Validate PR (MCP)

# The MCP package wraps the SDK's public client surface, and its parity test
# fails when a method gains no tool. That check is only useful if it runs on
# SDK changes too — so this workflow is deliberately NOT path-filtered.
# The called reusable workflow requests these; a caller that does not grant
# them fails at startup before any job runs.
permissions:
  id-token: write
  contents: read
  checks: write
  actions: read

on: pull_request

jobs:
  # Validates against the SDK at this commit, not the published one — see
  # mcp-validate.yml for why.
  validate-mcp:
    uses: ./.github/workflows/mcp-validate.yml
    with:
      node_version: "22"
